# SpotPet
- project: SpotPet
  role: Project Manager / iOS Developer
  duration: September, 2018 - May. 2019
  url: "https://keep.pet/spotpet"
  description: SpotPet is a geolocation service for pet owners. Inside the application, you can post announcements about missing pets, shops, etc., as well as communicate with other pets using chat. I was involved in writing technical specifications, resolving issues with the customer, leading the development team for iOS, Android applications and the server, and also directly coding the iOS application.
  frameworks: Swift, MVC, Coordinators, Alamofire, Moya, SwiftyJSON, RxSwift, Realm, GooglePlaces, APNs, SnapKit, AloeStackView, WebSocket, Fastlane, App Center, SwiftLint, Cocoapods, Git, TestFlight

